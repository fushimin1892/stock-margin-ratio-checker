# 保存済み銘柄の信用残を週次で取得し直して data/ を更新する。
# 信用残は週1回更新で、祝日があると発表が遅れるため水・木の2回実行する。
name: Update margin data

on:
  schedule:
    - cron: "0 1 * * 3,4"   # 水・木 10:00 (JST)
  workflow_dispatch:
    inputs:
      codes:
        description: "追加/更新する銘柄コード (スペース区切り。空なら保存済みの全銘柄)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTAL_DEPLOY_KEY: ${{ secrets.PORTAL_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build-version.js がコードの最終更新を git log から引くため

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 信用残を取得
        env:
          CODES: ${{ inputs.codes }}
        # CODES はあえてクォートしない (スペース区切りで複数の引数に分ける)
        run: node scripts/update-data.js $CODES

      - name: version.json を更新
        run: node scripts/build-version.js

      - name: 開発リポジトリにコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data version.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "data: 信用残データを更新"
            git push
          fi

      # 公開サイトへの反映。PORTAL_DEPLOY_KEY を登録するまでは実行されない
      - name: 公開サイトへ反映
        if: env.PORTAL_DEPLOY_KEY != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PORTAL_DEPLOY_KEY" > ~/.ssh/portal_key
          chmod 600 ~/.ssh/portal_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/portal_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:fushimin1892/fushimin1892.github.io.git portal
          APP=portal/apps/stock-margin-ratio-checker
          rm -rf "$APP/data"
          cp -r data "$APP/data"
          cp version.json "$APP/version.json"
          cd portal
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add apps/stock-margin-ratio-checker
          if git diff --cached --quiet; then
            echo "公開サイトの変更なし"
          else
            git commit -m "stock-margin-ratio-checker: 信用残データを更新"
            git push
          fi
